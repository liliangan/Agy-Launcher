settings.group.statusBarMonitor=Status Bar Monitor
settings.monitor.showStatusBarMetrics=Show context usage and output speed in status bar
settings.monitor.autoQueryContextOnIdle=Automatically send '/context' when output finishes
settings.monitor.autoQueryContextOnIdle.comment=Queries updated context usage after each streaming response becomes idle for 1.5s and auto-closes the panel.

