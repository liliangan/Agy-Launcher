# Actions & Groups
action.AgyLauncher.Launch.text=Launch Antigravity CLI
action.AgyLauncher.Launch.description=Open or focus Antigravity CLI in built-in Terminal

action.AgyLauncher.SendFileReference.text=Send File Reference to Antigravity
action.AgyLauncher.SendFileReference.description=Send selected file path (with line range if selected) to Antigravity CLI terminal

action.AgyLauncher.SendDiagnostic.text=Send Diagnostic / Error to Antigravity
