action.AgyLauncher.SendDiagnostic.noDiagnostic=No error or warning diagnostics found on the current line.

group.AgyLauncher.ToolsMenu.text=Agy Launcher
group.AgyLauncher.ToolsMenu.description=Agy Launcher actions

# Settings Panel
settings.group.cliExecution=CLI Execution
settings.cli.executable.label=agy executable:
settings.cli.executable.comment=Default is 'agy'. Set full path if not in system PATH.
settings.cli.defaultArgs.label=Default arguments:
settings.cli.defaultArgs.comment=Optional flags passed when launching agy (e.g., --model gemini-4-neon)
settings.cli.tabTitle.label=Terminal tab title:

settings.group.fileReference=File Reference Behavior
settings.ref.useAtPrefix=Prefix file path with '@' (e.g., @src/index.ts)
settings.ref.useRelativePath=Use project-relative path instead of absolute path
settings.ref.includeLineNumbers=Include selected line range when triggered from editor (e.g., #L10-L25)
settings.ref.appendTrailingSpace=Append a trailing space after inserting reference
