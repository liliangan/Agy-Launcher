# 设置项名称
configurable.AgySettings.displayName=Agy Launcher

# 动作与菜单分组
action.AgyLauncher.Launch.text=启动 Antigravity CLI
action.AgyLauncher.Launch.description=在内置终端中打开或聚焦 Antigravity CLI

action.AgyLauncher.SendFileReference.text=发送文件引用到 Antigravity
action.AgyLauncher.SendFileReference.description=将选中的文件路径（含选中行号范围）发送到 Antigravity CLI 终端

action.AgyLauncher.SendDiagnostic.text=发送报错 / 诊断信息到 Antigravity
action.AgyLauncher.SendDiagnostic.description=将当前光标行的文件路径、行号及报错或警告诊断信息发送到 Antigravity CLI 终端
action.AgyLauncher.SendDiagnostic.noDiagnostic=当前行未检测到报错或警告诊断信息。

group.AgyLauncher.ToolsMenu.text=Agy Launcher
group.AgyLauncher.ToolsMenu.description=Agy Launcher 快捷操作

# 设置面板
settings.group.cliExecution=CLI 执行配置
settings.cli.executable.label=agy 可执行文件：
settings.cli.executable.comment=默认为 'agy'；若未加入系统 PATH，请填写完整可执行文件路径。
settings.cli.defaultArgs.label=默认启动参数：
settings.cli.defaultArgs.comment=启动 agy 时附加的可选参数（例如 --model gemini-4-neon）
settings.cli.tabTitle.label=终端标签页标题：

settings.group.fileReference=文件引用行为
settings.ref.useAtPrefix=文件路径前添加 '@' 前缀（例如 @src/index.ts）
settings.ref.useRelativePath=使用相对项目的路径而非绝对路径
settings.ref.includeLineNumbers=从编辑器触发时附带选中行号范围（例如 #L10-L25）
settings.ref.appendTrailingSpace=插入文件引用后在末尾自动追加空格
settings.ref.autoStartIfNotRunning=未打开 Antigravity 终端标签页时自动启动 'agy'

settings.group.statusBarMonitor=状态栏监控
settings.monitor.showStatusBarMetrics=在底部状态栏显示上下文占用率与输出速度
settings.monitor.autoQueryContextOnIdle=每轮有效输出结束后自动发送 '/context'
settings.monitor.autoQueryContextOnIdle.comment=开启后将在每次流式输出静默 1.5 秒时自动发送 /context 更新上下文占比并自动关闭弹窗。

# 状态栏
statusbar.metrics.displayName=Agy 上下文、命中缓存与速率监控
statusbar.metrics.label={0}Agy: {1}上下文 {2} | 命中缓存 {3} | 速率 {4}
statusbar.metrics.tooltipDefault=上下文: --% | 命中缓存: --% | 速率: -- tok/s（左键刷新 /context，右键执行 /compact 压缩）
statusbar.metrics.tooltipDetail=上下文: {0} | 命中缓存: {1} | 速率: {2}（左键刷新 /context，右键执行 /compact 压缩）
statusbar.menu.refreshContext=刷新上下文 (Refresh Context /context)
statusbar.menu.compactContext=压缩上下文 (Compact Context /compact)
